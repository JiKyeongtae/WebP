<!DOCTYPE html>
<html>
<head>
    <title>setInterval, clearInterval</title>
    <style>
        div {
            display: inline-block;
            border: 1px solid black;
            background-color: aliceblue;
            width: 95px;
        }
    </style>
    <script>
        var time = null;

        // 시계의 작동과 정지를 토글
        function onofftime() {
            if (time != null) {
                clearInterval(time); // 시계를 정지
                time = null;
                document.getElementById("clock").style.color = "gray";
            } else {
                time = setInterval("outtime(clock)", 100); // 시계를 시작
                document.getElementById("clock").style.color = "black";
            }
        }

        // 시계를 초기화 및 시작
        function gotime() {
            var clock = document.getElementById("clock");
            outtime(clock);
            time = setInterval("outtime(clock)", 100);
        }

        // 현재 시간을 업데이트
        function outtime(e) {
            var date = new Date();
            e.innerHTML = date.toLocaleTimeString();
        }
    </script>
</head>
<body onload="gotime()">
    <h3>div 태그에 시계 만들기</h3>
    <p>시계를 클릭하면 시계가 멈추고 다시 클릭하면 가기 시작한다.</p>
    <hr>
    <div id="clock" onclick="onofftime()"></div>
</body>
</html>
